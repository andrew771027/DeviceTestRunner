name: Device Test Runner CI

on:
    push:
        branches:
            - "**"
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    code-quailiry:
        name: Code Quality
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                python-version: "3.14"

            - name: Install Poetry
              run: python -m pip install "poetry>=2,<3"

            - name: Install dependencies
              run: poetry install --no-interaction

            - name: Run pre-commit
              run: poetry run pre-commit run --all-files
    unit-tests:
        name: Unit Tests
        runs-on: ubuntu-latest
        strategy:
          fail-fast: false
          matrix:
            python-version:
              - "3.11"
              - "3.12"
              - "3.13"
        steps:
          - name: Checkout repository
            uses: actions/checkout@v7

          - name: Set up Python ${{ matrix.python-version }}
            uses: actions/setup-python@v7
            with:
              python-version: ${{ matrix.python-version }}

          - name: Display Python version
            run: python --version

          - name: Install Poetry
            run: python -m pip install "poetry>=2,<3"

          - name: Install dependencies
            run: poetry install --no-interaction

          - name: Create Arfifact directory
            run: mkdir -p artifacts/unit

          - name: Run Unit Test
            run: |
              poetry run pytest tests/test_unit \
              --junitxml=artifacts/unit/results.xml \
              --log-file=artifacts/unit/pytest.log \
              --log-file-level=INFO
          - name: Upload Unit Test Results
            if: always()
            uses: actions/upload-artifact@v7
            with:
              name: unit-test-results-${{ matrix.python-version }}
              path: artifacts/unit/
              if-no-files-found: error
              retention-days: 14

    integration-tests:
        name: Integration Tests
        runs-on: ubuntu-latest

        env:
          DTR_TEST_ARTIFACT_DIR: artifacts/integration/dtr

        steps:
          - name: Checkout repository
            uses: actions/checkout@v7

          - name: Set up Python
            uses: actions/setup-python@v7
            with:
              python-version: "3.14"

          - name: Install Poetry
            run: python -m pip install "poetry>=2,<3"

          - name: Install dependencies
            run: poetry install --no-interaction

          - name: Create artifact directory
            run: |
              mkdir -p artifacts/integration/reports
              mkdir -p artifacts/integration/logs
              mkdir -p artifacts/integration/dtr

          - name: Run integration tests
            run: |
              poetry run pytest tests/test_integration \
              --junitxml=artifacts/integration/junit.xml \
              --log-file=artifacts/integration/pytest.log \
              --log-file-level=INFO

          - name: Upload integration artifacts
            if: always()
            uses: actions/upload-artifact@v7
            with:
              name: integration-python-3.12
              path: artifacts/integration/
              if-no-files-found: warn
              retention-days: 14
