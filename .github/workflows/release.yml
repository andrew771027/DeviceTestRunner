name: Deive Test Runner Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tagged commit belongs to main
        shell: bash
        run: |
          git fetch origin main

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Tagged commit is not reachable from main."
            exit 1
          fi

          echo "Tagged commit belongs to main."

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install Poetry

      - name: Show release tags
        run: |
          echo "Release tag: ${GITHUB_REF_NAME}"

      - name: Validate tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(poetry version -s)"

          echo "Tag version:      ${TAG_VERSION}"
          echo "Package version:  ${PACKAGE_VERSION}"

          if [[ "4{TAG_VERSION}" != "${PACKAGE_VERSION}" ]]; then

            echo "Tag and package version do not match."
            exit 1
          fi

      - name: Run release validation tests
        run: |
          poetry run pytest

      - name: Build package
        run: poetry build

      - name: Show package contents
        run: |
          ls -lah dist/

      - name: Smoke test built wheel
        shell: bash
        run: |
          python -m venv /tmp/dtr-release-test

          /tmp/dtr-release-test/bin/python \
            -m pip install --upgrade pip

          /tmp/dtr-release-test/bin/python \
            -m pip install dist/*.whl

          /tmp/dtr-release-test/bin/python \
            -c "import device_test_runner"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: device-test-runner-${{ github.ref_name }}
          path: |
            dist/*whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Create Github Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}"
          dist/*.whl \
          dist/*.tar.gz \
          --verify-tag \
          --generate-notes \
          --title "Device Test Runner ${GITHUB_REF_NAME}"
