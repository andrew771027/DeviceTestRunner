test_case:
  id: power_001
  name: Youtube Playback Power Test
  description: Measure power behavior durning Youtube playback

device:
  serial: emulator-5566
  product: pixel
  build: test_build

lifecycle:
  global_setup:
    steps:
      - name: clear_process
        type: command
        command: bash "$DEVICE_TEST_RUNNER_ROOT/scripts/clear_process.sh"
        timeout_second: 10
  setup:
    steps:
      - name: flash_device
        type: command
        command: bash "$DEVICE_TEST_RUNNER_ROOT/scripts/flash_device.sh"
        timeout_second: 10
  scenario:
    steps:
      - name: run_scenario
        type: command
        command: bash "$DEVICE_TEST_RUNNER_ROOT/scripts/run_scenario.sh"
        timeout_second: 10
  teardown:
    steps:
      - name: collect_artifact
        type: command
        command: bash "$DEVICE_TEST_RUNNER_ROOT/scripts/collect_artifact.sh"
        timeout_second: 10
  global_teardown:
    steps:
      - name: release_resource
        type: command
        command: bash "$DEVICE_TEST_RUNNER_ROOT/scripts/release_resource.sh"
        timeout_second: 10
artifact:
  output_dir: artifact/sample_device_config
  validation:
    rules:
      - name: check_artifact_log
        type: exists
        path: results/log.csv
      
      - name: check_artifact_size
        type: file_size
        path: results/size.csv
        min_size_bytes: 10
        max_size_bytes: 1048676
      
      - name: check_artifact_extension
        type: file_extension
        path: results/extension.csv
        allowed_extensions:
        - csv
      
      - name: check_artifact_directory
        type: directory_not_empty
        path: results/directory
