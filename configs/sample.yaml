test_case:
  id: power_001
  name: Youtube Playback Power Test
  description: Measure power behavior durning Youtube playback

device:
  serial: emulator-5566
  product: pixel
  build: test_build

retry:
  max_attempts: 3
  delay_seconds: 1

lifecycle:
  global_setup:
    steps:
      - name: clear_process
        type: command
        command: bash "$DEVICE_TEST_RUNNER_ROOT/scripts/clear_process.sh"
        timeout_second: 10
  setup:
    steps:
      - name: flash_device
        type: command
        command: bash "$DEVICE_TEST_RUNNER_ROOT/scripts/flash_device.sh"
        timeout_second: 10
  scenario:
    steps:
      - name: run_scenario
        type: command
        command: bash "$DEVICE_TEST_RUNNER_ROOT/scripts/run_scenario.sh"
        timeout_second: 10
      - name: create_csv_test_file
        type: command
        command: |
          printf "timestamp,power,voltage\n1,100,4.2\n2,120,4.1\n" > ./test_csv_file.csv
        timeout_second: 10
      - name: create_json_test_file
        type: command
        command: |
          printf '{"status":"PASSED","metrics":{"average_power":110.0,"sample_count":2}}' > ./test_json_file.json
        timeout_second: 10
  teardown:
    steps:
      - name: collect_artifact
        type: command
        command: bash "$DEVICE_TEST_RUNNER_ROOT/scripts/collect_artifact.sh"
        timeout_second: 10
  global_teardown:
    steps:
      - name: release_resource
        type: command
        command: bash "$DEVICE_TEST_RUNNER_ROOT/scripts/release_resource.sh"
        timeout_second: 10
artifact:
  output_dir: artifact/sample_device_config
  validation:
    rules:
      - name: check_artifact_log
        type: exists
        path: ./log.csv

      - name: check_artifact_size
        type: file_size
        path: ./size.csv
        min_size_bytes: 10
        max_size_bytes: 1048676

      - name: check_artifact_extension
        type: file_extension
        path: ./extension.csv
        allowed_extensions:
        - csv

      - name: check_artifact_directory
        type: directory_not_empty
        path: ./directory

      - name: test_csv_file_exists
        type: exists
        path: ./test_csv_file.csv

      - name: test_csv_file_content
        type: csv_content
        path: ./test_csv_file.csv
        required_columns:
          - timestamp
          - power
          - voltage
        min_rows: 2

      - name: test_json_file_content
        type: json_content
        path: ./test_json_file.json

        required_json_paths:
          - status
          - metrics.average_power
          - metrics.sample_count

        expected_json_values:
          status: PASSED
          metrics.sample_count: 2
