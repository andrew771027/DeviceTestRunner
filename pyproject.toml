[project]
name = "devicetestrunner"
version = "1.7.2"
description = ""
authors = [
    {name = "Andrew Wang",email = "andew771027@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml (>=6.0.3,<7.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
]

[tool.poetry]
packages = [{ include = "runner" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

markers = [
    "test_lifecycle: Test lifecycle tests",
    "artifact: Artifact validation tests",
    "retry: Retry mechanism tests",
    "cancelled: Cancellation handling tests",
]

[tool.coverage.run]
branch = true
source = ["runner"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "artifacts/coverage/html"

[tool.coverage.xml]
output = "artifacts/coverage/coverage.xml"

[dependency-groups]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)"
]
